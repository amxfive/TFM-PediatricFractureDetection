[project]
name = "tfm-pediatricfracturedetection"
version = "0.1.0"
description = "Detection of pediatric upper-limb fractures using generalist and specialist YOLO architectures"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.135.2",
    "matplotlib>=3.10.8",
    "numpy>=1.24.0",
    "opencv-python-headless>=4.9.0",
    "pandas>=2.0.0",
    "pillow>=10.0.0",
    "pydicom>=3.0.1",
    "python-multipart>=0.0.22",
    "pyyaml>=6.0",
    "requests>=2.32.5",
    "streamlit==1.58.0",
    "tqdm>=4.66.0",
    "ultralytics>=8.4.14",
    "uvicorn[standard]>=0.42.0",
    "wandb>=0.25.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
