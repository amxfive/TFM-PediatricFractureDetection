services:
  backend:
    build:
      context: ./src/backend
    container_name: tfm_backend
    volumes:
      - ./models_weights/generalist_architectures:/app/models:ro
    environment:
      MODEL_PATH: /app/models/E6_yoloV8m.pt
      ALLOWED_ORIGINS: http://localhost:8501
    ports:
      - "8000:8000"
    networks:
      - tfm_network

  frontend:
    build:
      context: ./src/frontend
    container_name: tfm_frontend
    ports:
      - "8501:8501"
    environment:
      BACKEND_URL: http://backend:8000/predict
    depends_on:
      - backend
    networks:
      - tfm_network

networks:
  tfm_network:
    driver: bridge
